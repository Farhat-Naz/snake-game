<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #00f5d4;
    --accent-2: #f15bb5;
    --gold: #fee440;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* floating ambient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb1 { width: 400px; height: 400px; background: #5f0a87; top: -100px; left: -100px; }
  .orb2 { width: 350px; height: 350px; background: #00b4d8; bottom: -80px; right: -80px; animation-delay: -6s; }
  .orb3 { width: 250px; height: 250px; background: #f15bb5; top: 50%; left: 70%; animation-delay: -12s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, -40px) scale(1.15); }
  }

  .game-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px rgba(0, 245, 212, 0.45));
  }

  .hud {
    display: flex;
    gap: 14px;
    width: 100%;
    justify-content: center;
  }

  .hud .pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 130px;
    justify-content: center;
  }

  .pill .label { opacity: 0.55; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
  .pill .value { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
  .pill.best .value { color: var(--gold); }

  .board {
    position: relative;
    border-radius: 18px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 245, 212, 0.08);
  }

  canvas {
    display: block;
    border-radius: 10px;
    background: rgba(10, 8, 30, 0.75);
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(8, 6, 25, 0.82);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    text-align: center;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h2 {
    font-size: 2rem;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .overlay p { opacity: 0.7; font-size: 0.95rem; line-height: 1.6; }

  .overlay .final-score {
    font-size: 3rem;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(254, 228, 64, 0.5);
  }

  .new-best {
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 2px;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0f0c29;
    background: linear-gradient(90deg, var(--accent), #00bbf9);
    border: none;
    padding: 13px 38px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 24px rgba(0, 245, 212, 0.35);
  }
  button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 32px rgba(0, 245, 212, 0.55); }
  button:active { transform: translateY(0) scale(0.98); }

  .hint {
    font-size: 0.8rem;
    opacity: 0.45;
    letter-spacing: 1px;
  }
  kbd {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    padding: 2px 7px;
    font-family: inherit;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="game-wrap">
  <h1>Neon Snake</h1>

  <div class="hud">
    <div class="pill"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="pill best"><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="board">
    <canvas id="game" width="560" height="560"></canvas>

    <div class="overlay show" id="startOverlay">
      <h2>Neon Snake</h2>
      <p>Eat the glowing food. Don't bite yourself.<br>Walls wrap around — slither through!</p>
      <button id="startBtn">Play</button>
      <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>WASD</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> to pause</p>
    </div>

    <div class="overlay" id="gameOverOverlay">
      <h2>Game Over</h2>
      <div class="final-score" id="finalScore">0</div>
      <div class="new-best" id="newBest" style="display:none">★ New Best! ★</div>
      <button id="restartBtn">Play Again</button>
    </div>

    <div class="overlay" id="pauseOverlay">
      <h2>Paused</h2>
      <p>Press <kbd>Space</kbd> to resume</p>
    </div>
  </div>

  <p class="hint">Speed increases as you grow…</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const GRID = 20;                 // cells per side
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');

  let snake, dir, nextDir, food, score, best, particles, foodPulse;
  let moveInterval, moveTimer, running = false, paused = false, gameOver = false;
  let prevSnake;                   // previous positions, for smooth interpolation
  let lastMoveTime = 0;

  best = +localStorage.getItem('neon-snake-best') || 0;
  bestEl.textContent = best;

  // ---------- audio (tiny WebAudio blips, no files needed) ----------
  let audioCtx;
  function beep(freq, duration = 0.08, type = 'sine', gain = 0.12) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* audio blocked — fine */ }
  }

  // ---------- game setup ----------
  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    particles = [];
    foodPulse = 0;
    moveInterval = 150;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.5;
      const speed = 1.5 + Math.random() * 2.5;
      particles.push({
        x: (x + 0.5) * CELL,
        y: (y + 0.5) * CELL,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color
      });
    }
  }

  // ---------- game step (fixed timestep) ----------
  function step(now) {
    dir = nextDir;
    prevSnake = snake.map(s => ({ ...s }));
    lastMoveTime = now;

    const head = {
      x: (snake[0].x + dir.x + GRID) % GRID,
      y: (snake[0].y + dir.y + GRID) % GRID
    };

    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      spawnParticles(food.x, food.y, '#f15bb5');
      beep(440 + score * 12, 0.1, 'square', 0.08);
      // speed up gently, capped
      moveInterval = Math.max(70, 150 - score * 3);
      placeFood();
      // keep tail (snake grows)
    } else {
      snake.pop();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    beep(160, 0.4, 'sawtooth', 0.1);
    finalScoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('neon-snake-best', best);
      bestEl.textContent = best;
      newBestEl.style.display = 'block';
    } else {
      newBestEl.style.display = 'none';
    }
    setTimeout(() => gameOverOverlay.classList.add('show'), 400);
  }

  // ---------- rendering ----------
  function drawGridLines() {
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }
  }

  // interpolated pixel position of a segment, handling wrap-around
  function lerpSeg(prev, curr, t) {
    let dx = curr.x - prev.x;
    let dy = curr.y - prev.y;
    // wrap: jump across board reads as ±(GRID-1); animate through the edge instead
    if (dx > 1) dx -= GRID; else if (dx < -1) dx += GRID;
    if (dy > 1) dy -= GRID; else if (dy < -1) dy += GRID;
    return {
      x: (prev.x + dx * t + 0.5) * CELL,
      y: (prev.y + dy * t + 0.5) * CELL
    };
  }

  function drawSnake(t) {
    const n = snake.length;
    // body: rounded line strip with gradient glow
    const pts = snake.map((seg, i) => {
      const prev = prevSnake[i] || prevSnake[prevSnake.length - 1] || seg;
      return lerpSeg(prev, seg, t);
    });

    for (let i = n - 1; i >= 0; i--) {
      const p = pts[i];
      const frac = i / Math.max(n - 1, 1);
      const radius = CELL * (0.46 - 0.13 * frac);
      const hue = 165 - frac * 40; // teal head fading toward green-blue tail

      ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
      ctx.shadowBlur = i === 0 ? 22 : 10;
      ctx.fillStyle = `hsl(${hue}, 95%, ${62 - frac * 18}%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // eyes on the head
    const head = pts[0];
    const ex = dir.x, ey = dir.y;
    // perpendicular offset for two eyes
    const px = -ey, py = ex;
    const eyeOff = CELL * 0.18, fwd = CELL * 0.12;
    ctx.fillStyle = '#0f0c29';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(head.x + ex * fwd + px * eyeOff * side,
              head.y + ey * fwd + py * eyeOff * side,
              CELL * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFood() {
    foodPulse += 0.08;
    const cx = (food.x + 0.5) * CELL;
    const cy = (food.y + 0.5) * CELL;
    const r = CELL * 0.3 + Math.sin(foodPulse) * CELL * 0.05;

    const grad = ctx.createRadialGradient(cx, cy, 1, cx, cy, r * 2.2);
    grad.addColorStop(0, 'rgba(241, 91, 181, 0.9)');
    grad.addColorStop(0.5, 'rgba(241, 91, 181, 0.25)');
    grad.addColorStop(1, 'rgba(241, 91, 181, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = '#f15bb5';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff8fab';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= 0.025;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main loop ----------
  function loop(now) {
    requestAnimationFrame(loop);
    if (paused) return;

    if (running && now - lastMoveTime >= moveInterval) {
      step(now);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGridLines();
    drawFood();
    const t = running ? Math.min((now - lastMoveTime) / moveInterval, 1) : 1;
    drawSnake(t);
    drawParticles();
  }

  // ---------- input ----------
  const keyDirs = {
    ArrowUp: { x: 0, y: -1 },  w: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },a: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },d: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (running || paused) {
        paused = !paused;
        pauseOverlay.classList.toggle('show', paused);
        if (!paused) lastMoveTime = performance.now();
      }
      return;
    }
    const d = keyDirs[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (!d || !running) return;
    e.preventDefault();
    // no instant 180° turns
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  // touch swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart || !running) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    const d = Math.abs(dx) > Math.abs(dy)
      ? { x: Math.sign(dx), y: 0 }
      : { x: 0, y: Math.sign(dy) };
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    touchStart = null;
  }, { passive: true });

  function start() {
    reset();
    startOverlay.classList.remove('show');
    gameOverOverlay.classList.remove('show');
    gameOver = false;
    running = true;
    paused = false;
    lastMoveTime = performance.now();
    beep(520, 0.12, 'triangle', 0.1);
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
